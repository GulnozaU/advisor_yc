<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advisor on Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#fffaf5; --ink:#1d1f1c; --muted:#5f5e57; --line:#FED7AA; --tint:#FFEDD5; --accent:#F97316; --accent-hover:#EA580C; --danger:#9a3b2f; }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; background:var(--bg); color:var(--ink); font-family:Manrope,sans-serif; display:flex; flex-direction:column; }
    header { padding:28px 40px; display:flex; justify-content:space-between; align-items:center; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    header b { color:var(--ink); font-weight:600; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#b5ae9f; margin-right:8px; transition:background-color .3s; }
    .dot.live { background:var(--accent); box-shadow:0 0 0 4px var(--tint); }
    main { flex:1; display:grid; place-items:center; padding:24px; }
    .card { width:min(440px,100%); text-align:center; animation:rise .7s ease both; }
    h1 { font-family:Fraunces,serif; font-weight:300; font-size:clamp(36px,6vw,56px); line-height:1.05; letter-spacing:-.02em; }
    .sub { color:var(--muted); margin-top:14px; font-size:15px; line-height:1.6; }
    .orb-wrap { margin:56px auto 48px; width:180px; height:180px; position:relative; display:grid; place-items:center; }
    .ring { position:absolute; inset:0; border-radius:50%; border:1px solid var(--line); transition:transform .6s ease, opacity .6s ease; }
    .ring.r2 { inset:-22px; opacity:.6; }
    .orb { width:150px; height:150px; border-radius:50%; background:var(--tint); transition:transform .4s ease, opacity .4s ease; opacity:.55; }
    body.connected .orb { opacity:1; animation:breathe 4s ease-in-out infinite; }
    body.speaking .orb { animation:none; transform:translateY(calc(var(--v, 0) * -4px)) scale(calc(1 + var(--v, 0) * .04)); }
    .mouth { position:absolute; left:50%; top:var(--mouth-top, 55.5%); width:var(--mouth-w, 18px); height:calc(6px + var(--v, 0) * 10px); transform:translate(-50%, -40%); border-radius:45% 45% 55% 55%; background:#9A3412; border:2px solid var(--accent); box-shadow:inset 0 -3px 0 #FB923C; opacity:0; pointer-events:none; transition:opacity .2s ease; }
    body.speaking .mouth { opacity:1; }
    body.speaking .ring { transform:scale(1.06); }
    body.speaking .ring.r2 { transform:scale(1.1); opacity:.9; }
    #status { font-size:14px; color:var(--muted); min-height:22px; margin-bottom:28px; transition:color .3s; }
    #status.error { color:var(--danger); }
    button { font:inherit; font-weight:600; font-size:15px; letter-spacing:.02em; border:0; cursor:pointer; padding:16px 40px; border-radius:999px; background:var(--accent); color:#fff; transition:background-color .25s, transform .15s, opacity .25s; }
    button:hover { transform:translateY(-1px); background:var(--accent-hover); }
    button:focus-visible { outline:3px solid var(--line); outline-offset:3px; background:var(--accent-hover); }
    button.end:hover { background:#7f2f25; }
    button:active { transform:translateY(1px); }
    button:disabled { opacity:.5; cursor:default; transform:none; }
    button.end { background:var(--danger); }
    footer { padding:24px 40px; font-size:12px; color:var(--muted); text-align:center; }
    @keyframes breathe { 50% { transform:scale(1.05); } }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  </style>
</head>
<body>
  <header>
    <span><b>Advisor</b> on Call</span>
    <span data-testid="connection-indicator"><span class="dot" id="dot"></span><span id="conn">Offline</span></span>
  </header>
  <main>
    <div class="card">
      <h1>Speak with your advisor.</h1>
      <p class="sub">A private voice line. Just ask naturally.</p>
      <div class="orb-wrap" data-testid="voice-orb"><div class="ring r2"></div><div class="ring"></div><canvas class="orb" id="operator" width="300" height="300" data-testid="rive-operator"></canvas><div class="mouth" data-testid="operator-mouth"></div></div>
      <p id="status" data-testid="call-status">Ready when you are.</p>
      <button id="callBtn" data-testid="call-toggle-button">Start call</button>
    </div>
  </main>
  <footer>Microphone access is required. Audio streams directly to your advisor.</footer>

  <script src="https://unpkg.com/@rive-app/canvas@2"></script>
  <script>
    window.operator = new rive.Rive({
      src: "/orange-operator.riv",
      canvas: document.getElementById("operator"),
      autoplay: true,
      onLoad: () => {
        operator.resizeDrawingSurfaceToCanvas();
        if (operator.stateMachineNames.length) operator.play(operator.stateMachineNames[0]);
      },
    });
    window.setOperatorAttentive = (on) => {
      const input = operator.stateMachineInputs("State Machine 1")?.find((i) => i.name === "istracking");
      if (input) input.value = on;
    };
  </script>
  <script type="module">
    import { Conversation } from "https://esm.sh/@elevenlabs/client@0";

    const btn = document.getElementById("callBtn");
    const statusEl = document.getElementById("status");
    const dot = document.getElementById("dot");
    const conn = document.getElementById("conn");
    let conversation = null;

    const setStatus = (text, isError = false) => {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    };
    const root = document.documentElement;
    let raf = null;
    const lipSync = () => {
      const v = conversation && document.body.classList.contains("speaking") ? Math.min(1, conversation.getOutputVolume() * 2.5) : 0;
      root.style.setProperty("--v", v.toFixed(3));
      raf = requestAnimationFrame(lipSync);
    };
    const setLive = (live) => {
      window.setOperatorAttentive?.(live);
      cancelAnimationFrame(raf);
      if (live) lipSync(); else root.style.setProperty("--v", 0);
      document.body.classList.toggle("connected", live);
      if (!live) document.body.classList.remove("speaking");
      dot.classList.toggle("live", live);
      conn.textContent = live ? "Live" : "Offline";
      btn.textContent = live ? "End call" : "Start call";
      btn.classList.toggle("end", live);
    };

    async function startCall() {
      btn.disabled = true;
      try {
        setStatus("Requesting microphone…");
        await navigator.mediaDevices.getUserMedia({ audio: true });
        setStatus("Connecting…");
        const res = await fetch("/api/get-voice-token");
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.signedUrl) throw new Error(data.error || "Could not get a voice token.");
        conversation = await Conversation.startSession({
          signedUrl: data.signedUrl,
          connectionType: "websocket",
          onConnect: () => { setLive(true); setStatus("Connected — go ahead and speak."); },
          onDisconnect: () => { conversation = null; setLive(false); setStatus("Call ended."); },
          onError: (msg) => { console.error(msg); setStatus(typeof msg === "string" ? msg : "Something went wrong.", true); },
          onModeChange: ({ mode }) => {
            document.body.classList.toggle("speaking", mode === "speaking");
            setStatus(mode === "speaking" ? "Advisor is speaking…" : "Listening…");
          },
        });
      } catch (err) {
        console.error(err);
        conversation = null;
        setLive(false);
        setStatus(err.name === "NotAllowedError" ? "Microphone access was denied." : err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function endCall() {
      btn.disabled = true;
      try { await conversation?.endSession(); } finally { conversation = null; setLive(false); btn.disabled = false; }
    }

    btn.addEventListener("click", () => (conversation ? endCall() : startCall()));
  </script>
</body>
</html>
